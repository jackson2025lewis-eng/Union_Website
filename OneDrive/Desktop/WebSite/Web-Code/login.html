<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LSA Global Registry - Login</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        .profile-list {
            list-style: none;
            padding: 0;
            margin: 0;
            background: var(--color-bg-light);
            border-radius: var(--border-radius-md);
            padding: 20px;
            border: 1px solid var(--color-border);
        }
        .profile-list li {
            padding: 12px 0;
            border-bottom: 1px solid rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .profile-list li:last-child {
            border-bottom: none;
        }
        .profile-list li strong {
            color: var(--color-bg-dark);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        .profile-list li span {
            color: var(--color-text-main);
            font-size: 1.1rem;
            font-weight: 500;
        }
        
        /* Layout logic to swap forms */
        #profile-section { display: none; animation: fadeIn 0.4s ease; }
        #login-form-section { display: block; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="dashboard-body">

    <!-- Header -->
    <header class="header">
        <a href="index.html" class="logo-container">
            <img src="/images/logo.png" alt="LSA Logo Left" class="logo">
        </a>
        <nav class="navbar">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="dashboard.html">Back</a></li>
            </ul>
        </nav>
    </header>

    <!-- Main Layout -->
    <div class="dashboard-container">
        <div class="dashboard-card" style="max-width: 600px; padding: 40px;">
            
            <!-- SECTION 1: LOGIN FORM -->
            <div id="login-form-section">
                <div class="secure-icon"><i class='bx bx-user-circle'></i></div>
                <h2 class="dashboard-title" style="font-size: 1.8rem;">Member Login</h2>
                <p class="dashboard-text">Enter your registered email and secure password to access your official database records.</p>
                
                <form id="loginForm" class="access-form" onsubmit="handleLogin(event)">
                    <div style="text-align: left; margin-bottom: 20px;">
                        <div class="input-group" style="margin-bottom: 0;">
                            <i class='bx bx-envelope'></i>
                            <input type="email" id="login-email" placeholder="Email Address" class="access-input" required>
                        </div>
                    </div>
                    
                    <div style="text-align: left; margin-bottom: 20px;">
                        <div class="input-group" style="margin-bottom: 0;">
                            <i class='bx bx-lock-alt'></i>
                            <input type="password" id="login-password" placeholder="Password" class="access-input" required>
                        </div>
                    </div>
                    
                    <p id="login-error" style="color: var(--color-primary); display: none; font-weight: 500; margin-bottom: 15px;">Invalid Email or Password. Please try again.</p>

                    <button type="submit" class="btn btn-primary dashboard-btn"><i class='bx bx-log-in-circle'></i> Access Registry Account</button>
                </form>
            </div>

            <!-- SECTION 2: PROFILE OVERVIEW -->
            <div id="profile-section">
                <div class="secure-icon" style="background: rgba(18, 183, 106, 0.1); color: #12b76a;"><i class='bx bx-user-check'></i></div>
                <h2 class="dashboard-title" style="font-size: 1.8rem; margin-bottom: 10px;">Official Database Record</h2>
                <p class="dashboard-text" style="margin-bottom: 30px;">Your secure details from the LSA Global Registry are displayed below.</p>
                
                <div id="profile-data" style="text-align: left; margin-bottom: 30px;">
                    <!-- Javascript will inject LIs here -->
                </div>
                
                <button class="btn btn-blue dashboard-btn" onclick="downloadRecord()"><i class='bx bx-download'></i> Download Official Record PDF/TXT</button>
                <a href="index.html" class="btn btn-secondary dashboard-btn" style="margin-top: 15px; color: var(--color-text-muted); border-color: transparent;" onclick="sessionStorage.removeItem('lsa_auth_granted')"><i class='bx bx-log-out'></i> Secure Logout</a>
            </div>

        </div>
    </div>

    <!-- Script Logic -->
    <script>
        function handleLogin(e) {
            e.preventDefault();
            
            const savedEmail = localStorage.getItem('lsa_auth_email');
            const savedPassword = localStorage.getItem('lsa_auth_password');
            
            const inputEmail = document.getElementById('login-email').value;
            const inputPassword = document.getElementById('login-password').value;
            const errorMsg = document.getElementById('login-error');

            if (savedEmail && savedPassword && inputEmail === savedEmail && inputPassword === savedPassword) {
                // Success
                errorMsg.style.display = 'none';
                document.getElementById('login-form-section').style.display = 'none';
                document.getElementById('profile-section').style.display = 'block';
                
                loadProfileData();
            } else {
                // Failure
                errorMsg.style.display = 'block';
            }
        }

        function loadProfileData() {
            const userDataStr = localStorage.getItem('lsa_user_data');
            if (userDataStr) {
                const userData = JSON.parse(userDataStr);
                let html = '<ul class="profile-list">';
                
                for (let key in userData) {
                    html += `<li><strong>${key}</strong> <span>${userData[key]}</span></li>`;
                }
                
                html += '</ul>';
                document.getElementById('profile-data').innerHTML = html;
            } else {
                document.getElementById('profile-data').innerHTML = '<p>No profile data found attached to this account.</p>';
            }
        }

        function downloadRecord() {
            const userDataStr = localStorage.getItem('lsa_user_data');
            if(!userDataStr) return;
            const userData = JSON.parse(userDataStr);
            
            let text = "==============================================\n";
            text +=    " LSA GLOBAL REGISTRY - OFFICIAL MEMBER RECORD \n";
            text +=    "==============================================\n\n";
            text +=    "CONFIDENTIAL - DO NOT SHARE\n";
            text +=    "Timestamp: " + new Date().toLocaleString() + "\n\n";
            
            for(let key in userData) {
                text += `${key.toUpperCase().padEnd(30, ' ')} : ${userData[key]}\n`;
            }
            
            text += "\n==============================================\n";
            text += "Verified by Liberia Students Association.\n";

            // Create a blob and simulate auto-download
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            
            const a = document.createElement('a');
            a.href = url;
            a.download = "LSA_Official_Record.txt";
            document.body.appendChild(a); // append to body required for FF
            a.click();
            document.body.removeChild(a);
            
            URL.revokeObjectURL(url);
        }
    </script>
</body>
</html>
